apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: easy-circulars-neo4j-deployment
  name: easy-circulars-neo4j-deployment
  namespace: easy-circulars
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: easy-circulars-neo4j-deployment
  template:
    metadata:
      annotations:
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: easy-circulars-neo4j-deployment
    spec:
      nodeSelector:
        kubernetes.io/hostname: g2-r1-2
      containers:
        - image: neo4j:latest
          name: easy-circulars-neo4j-container
          ports:
            - containerPort: 7474
              protocol: TCP
            - containerPort: 7687
              protocol: TCP
          env:
            - name: NEO4J_AUTH
              value: "neo4j/password"
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: easy-circulars-neo4j-deployment
  name: easy-circulars-neo4j-deployment
  namespace: easy-circulars
spec:
  type: NodePort
  ports:
    - name: "7474"
      port: 7474
      protocol: TCP
      targetPort: 7474
      nodePort: 30074
    - name: "7687"
      port: 7687
      protocol: TCP
      targetPort: 7687
      nodePort: 30087
  selector:
    io.kompose.service: easy-circulars-neo4j-deployment