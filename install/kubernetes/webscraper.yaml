apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: easy-circulars-webscraper-deployment
  name: easy-circulars-webscraper-deployment
  namespace: easy-circulars
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: easy-circulars-webscraper-deployment
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: easy-circulars-webscraper-deployment
    spec:
      nodeSelector:
        kubernetes.io/hostname: g2-wyn02
      containers:
        - env:
            - name: SERVER_HOST_IP
              value: easy-circulars-backend-deployment
            - name: SERVER_PORT
              value: "5013"
            - name: DATAPREP_HOST_IP
              value: easy-circulars-dataprep-deployment
            - name: DATAPREP_PORT
              value: "5012"
            - name: LLM_SERVER_HOST_IP
              value: g2-wyn02.iind.intel.com
            - name: LLM_SERVER_PORT
              value: "31025"
            - name: LLM_MODEL_ID
              value: "meta-llama/Meta-Llama-3.1-8B-Instruct"
            - name: LLM_USE_MODEL_PARAM
              value: "true"
            - name: NEO4J_URI
              value: "bolt://easy-circulars-neo4j-deployment:7687"
            - name: NEO4J_USER
              value: "neo4j"
            - name: NEO4J_PASSWORD
              value: "password"
            - name: HTTPS_PROXY
              value: http://proxy-dmz.intel.com:912
            - name: HTTP_PROXY
              value: http://proxy-dmz.intel.com:912
            - name: http_proxy
              value: http://proxy-dmz.intel.com:912
            - name: https_proxy
              value: http://proxy-dmz.intel.com:912
            - name: no_proxy
              value: 127.0.0.1,localhost,.intel.com,easy-circulars-dataprep-deployment,easy-circulars-backend-deployment,g2-wyn02.iind.intel.com
          image: navchetna/easy-circulars-webscraper:latest
          name: easy-circulars-webscraper-container
          ports:
            - containerPort: 8000
              protocol: TCP
          volumeMounts:
            - mountPath: /home/user/ui/public/pdfs
              name: pdfs
      restartPolicy: Always
      volumes:
        - hostPath:
            path: /home/intel/easy-circulars/ui/public/pdfs
          name: pdfs
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: easy-circulars-webscraper-deployment
  name: easy-circulars-webscraper-deployment
  namespace: easy-circulars
spec:
  type: NodePort
  ports:
    - name: "5102"
      port: 5102
      protocol: TCP
      targetPort: 8002
      nodePort: 30017
  selector:
    io.kompose.service: easy-circulars-webscraper-deployment
